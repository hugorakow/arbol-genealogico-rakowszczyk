<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Árbol Genealógico Rakowszczyk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3EEE3; --bg-alt:#EAE3D2; --card:#FFFDF9; --ink:#2A2118; --ink-soft:#5C5445;
    --accent:#4F5F45; --accent-dark:#3A4834; --accent-soft:#DDE3D3;
    --gold:#8C6B3F; --gold-soft:#EFE2C6; --pending:#C4732A; --pending-bg:#FBEADA; --pending-border:#E0A25C;
    --border:#DBD2BC; --danger:#A6432E; --shadow: 0 2px 10px rgba(42,33,24,0.08);
    --shadow-lg: 0 8px 28px rgba(42,33,24,0.14);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1E2621; --bg-alt:#232C26; --card:#26302A; --ink:#EDE7D9; --ink-soft:#B9B2A0;
      --accent:#9BB98A; --accent-dark:#7FA06D; --accent-soft:#33402F;
      --gold:#CBA96A; --gold-soft:#3A331F; --pending:#E0A25C; --pending-bg:#3A2E1E; --pending-border:#8C6231;
      --border:#3A4339; --danger:#D97A65; --shadow: 0 2px 10px rgba(0,0,0,0.3); --shadow-lg: 0 10px 32px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1E2621; --bg-alt:#232C26; --card:#26302A; --ink:#EDE7D9; --ink-soft:#B9B2A0;
    --accent:#9BB98A; --accent-dark:#7FA06D; --accent-soft:#33402F;
    --gold:#CBA96A; --gold-soft:#3A331F; --pending:#E0A25C; --pending-bg:#3A2E1E; --pending-border:#8C6231;
    --border:#3A4339; --danger:#D97A65; --shadow: 0 2px 10px rgba(0,0,0,0.3); --shadow-lg: 0 10px 32px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:16px; line-height:1.5;
    background-image: radial-gradient(circle at 15% 0%, var(--accent-soft) 0%, transparent 45%);
    background-attachment: fixed;
  }
  h1,h2,h3,.serif{font-family:'Lora',Georgia,serif;}
  h1{font-size:1.7rem; margin:0; font-weight:600;}
  h2{font-size:1.35rem; margin:0 0 .8rem; font-weight:600; color:var(--accent-dark); display:flex; align-items:center; gap:.45rem;}
  h3{font-size:1.05rem; margin:0 0 .4rem; font-weight:600;}
  a{color:var(--accent-dark);}
  button{font-family:inherit; cursor:pointer;}
  .link-name{color:var(--accent-dark); text-decoration:underline; text-underline-offset:2px; cursor:pointer; font-weight:600;}
  .link-name:hover{color:var(--gold);}
  #topbar{
    position:sticky; top:0; z-index:20; background:linear-gradient(135deg, var(--accent-dark), var(--accent));
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:.7rem; padding:.75rem 1.1rem; flex-wrap:wrap;
    box-shadow:var(--shadow);
  }
  #topbar .btn.secondary{color:#fff; border-color:rgba(255,255,255,.5);}
  #topbar .btn.secondary:hover{background:rgba(255,255,255,.15);}
  #topbar .title{flex:1; min-width:180px;}
  #topbar .title h1{font-size:1.15rem; color:#fff;}
  #topbar .title span{font-size:.75rem; color:rgba(255,255,255,.8);}
  .btn{
    background:var(--accent); color:#fff; border:none; border-radius:8px;
    padding:.55rem .95rem; font-size:.88rem; font-weight:600; transition:background .15s, transform .1s;
  }
  .btn:hover{background:var(--accent-dark); transform:translateY(-1px);}
  .btn.secondary{background:transparent; color:var(--accent-dark); border:1px solid var(--border);}
  .btn.secondary:hover{background:var(--accent-soft);}
  .btn.danger{background:var(--danger);}
  .btn.small{padding:.34rem .65rem; font-size:.78rem;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  main{max-width:1020px; margin:0 auto; padding:1.4rem 1rem 3rem;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:1.2rem; box-shadow:var(--shadow);
  }
  .pending{
    border:1.5px dashed var(--pending-border) !important; background:var(--pending-bg) !important;
  }
  .badge{
    display:inline-block; font-size:.68rem; font-weight:700; padding:.15rem .5rem; border-radius:20px;
    background:var(--pending); color:#fff; letter-spacing:.02em; vertical-align:middle;
  }
  .badge.count{background:var(--danger);}
  input[type=text],input[type=date],input[type=password],select,textarea{
    width:100%; padding:.55rem .7rem; border:1px solid var(--border); border-radius:7px;
    background:var(--card); color:var(--ink); font-family:inherit; font-size:.92rem;
  }
  input[type=file]{width:100%; font-size:.85rem;}
  label{font-size:.82rem; font-weight:600; color:var(--ink-soft); display:block; margin:.6rem 0 .25rem;}
  .field{margin-bottom:.4rem;}
  .row{display:flex; gap:.6rem; flex-wrap:wrap;}
  .row > *{flex:1; min-width:140px;}
  .autocomplete-wrap{position:relative;}
  .suggestions{
    position:absolute; top:100%; left:0; right:0; background:var(--card); border:1px solid var(--border);
    border-top:none; border-radius:0 0 8px 8px; max-height:220px; overflow-y:auto; z-index:30;
    box-shadow:var(--shadow);
  }
  .suggestions div{padding:.5rem .7rem; cursor:pointer; font-size:.9rem;}
  .suggestions div:hover{background:var(--accent-soft);}
  .center-screen{
    min-height:80vh; display:flex; align-items:center; justify-content:center; padding:1.2rem;
  }
  .login-box{max-width:420px; width:100%;}
  .login-box .brand{text-align:center; margin-bottom:1.4rem;}
  .login-box .brand h1{font-size:1.9rem; justify-content:center;}
  .login-box .brand p{color:var(--ink-soft); font-size:.9rem; margin:.3rem 0 0;}
  .hero-tree{width:120px; height:120px; margin:0 auto .5rem;}
  .menu-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:.9rem; margin-top:1.2rem;}
  .menu-item{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:1.1rem .8rem; text-align:center; box-shadow:var(--shadow); position:relative;
    transition:transform .15s, box-shadow .15s;
  }
  .menu-item:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg);}
  .menu-item .icon{font-size:1.8rem; display:block; margin-bottom:.5rem;}
  .menu-item span.label{font-weight:600; font-size:.88rem;}
  .section{margin-bottom:1.6rem;}
  .home-hero{
    display:flex; align-items:center; gap:1.2rem; background:linear-gradient(120deg, var(--accent-soft), var(--card));
    border:1px solid var(--border); border-radius:var(--radius); padding:1.2rem; box-shadow:var(--shadow); margin-bottom:1.2rem;
  }
  .home-hero .hero-art{width:88px; height:88px; flex-shrink:0;}
  .home-hero h2{margin-bottom:.2rem;}
  .tree-canvas{position:relative;}
  .tree-connector{display:flex; justify-content:center;}
  .tree-connector-line{width:2px; height:24px; background:var(--border);}
  .gen-row{margin-bottom:0;}
  .gen-label{font-size:.78rem; text-transform:none; color:var(--gold); font-weight:700; margin-bottom:.5rem; letter-spacing:.02em; text-align:center;}
  .cards-scroll{display:flex; gap:.8rem; overflow-x:auto; padding:.4rem .2rem .6rem; justify-content:safe center;}
  .person-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:.75rem; min-width:132px; max-width:132px; text-align:center; cursor:pointer;
    box-shadow:var(--shadow); flex-shrink:0; transition:transform .15s, box-shadow .15s;
  }
  .person-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg);}
  .person-card.center{border:2px solid var(--accent); background:var(--accent-soft);}
  .avatar{
    width:64px; height:64px; border-radius:50%; background:var(--accent-soft); margin:0 auto .5rem;
    display:flex; align-items:center; justify-content:center; font-size:1.5rem; overflow:hidden;
    color:var(--accent-dark); font-family:'Lora',serif; font-weight:600; border:2px solid var(--card); box-shadow:0 0 0 2px var(--border);
  }
  .avatar img{width:100%; height:100%; object-fit:cover;}
  .avatar.large{width:96px; height:96px; font-size:2rem;}
  .person-card .pname{font-size:.82rem; font-weight:600; line-height:1.2;}
  .person-card .pdates{font-size:.72rem; color:var(--ink-soft); margin-top:.2rem;}
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,16,10,.5); display:flex; align-items:flex-start;
    justify-content:center; padding:2rem 1rem; z-index:50; overflow-y:auto;
  }
  .modal{
    background:var(--card); border-radius:var(--radius); max-width:560px; width:100%;
    padding:1.3rem; box-shadow:0 10px 40px rgba(0,0,0,.25);
  }
  .modal-close{float:right; background:none; border:none; font-size:1.3rem; color:var(--ink-soft); line-height:1;}
  .kv{display:flex; justify-content:space-between; padding:.4rem 0; border-bottom:1px solid var(--border); font-size:.88rem; gap:1rem;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--ink-soft); flex-shrink:0;}
  .kv .v{text-align:right;}
  .note-item{padding:.5rem .6rem; border-radius:7px; background:var(--bg-alt); margin-bottom:.4rem; font-size:.85rem;}
  .empty{color:var(--ink-soft); font-style:italic; font-size:.9rem; padding:.8rem 0;}
  details.timeline summary{cursor:pointer; font-weight:600; padding:.6rem 0;}
  .tl-item{display:flex; gap:.7rem; padding:.5rem 0; border-bottom:1px solid var(--border); font-size:.88rem;}
  .tl-year{font-family:'Lora',serif; font-weight:700; color:var(--gold); min-width:98px; flex-shrink:0;}
  .search-results{margin-top:.6rem;}
  .search-result-item{
    display:flex; align-items:center; gap:.6rem; padding:.55rem .3rem; border-bottom:1px solid var(--border);
    cursor:pointer; border-radius:7px;
  }
  .search-result-item:hover{background:var(--accent-soft);}
  .mini-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--accent-dark);font-weight:600;flex-shrink:0;overflow:hidden;}
  .mini-avatar img{width:100%;height:100%;object-fit:cover;}
  .tabs{display:flex; gap:.4rem; margin-bottom:1rem; flex-wrap:wrap;}
  .tab-btn{background:var(--bg-alt); border:1px solid var(--border); border-radius:8px; padding:.4rem .8rem; font-size:.85rem; font-weight:600; color:var(--ink-soft);}
  .tab-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .pending-list-item{border:1.5px dashed var(--pending-border); background:var(--pending-bg); border-radius:8px; padding:.7rem; margin-bottom:.6rem; font-size:.87rem;}
  .hist-item{padding:.5rem 0; border-bottom:1px solid var(--border); font-size:.83rem;}
  .place-group{margin-bottom:1rem;}
  .place-group h3{font-size:.95rem; color:var(--gold);}
  .residence-item{font-size:.85rem; padding:.15rem 0;}
  .toast{
    position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%); background:var(--accent-dark);
    color:#fff; padding:.6rem 1.1rem; border-radius:8px; font-size:.87rem; z-index:100; box-shadow:var(--shadow);
  }
  .footer-note{text-align:center; color:var(--ink-soft); font-size:.75rem; margin-top:2rem;}
  @media (max-width:520px){
    .login-box{max-width:100%;}
    .home-hero{flex-direction:column; text-align:center;}
  }
</style>
</head>

function normalize(s){
  if(!s) return "";
  return s.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();

function uid(){ return "p_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
const GED_MONTHS = {JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11};
function parseGedDate(str){
  if(!str) return null;
  const full = str.match(/(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})/);
  if(full && GED_MONTHS[full[2].toUpperCase()]!==undefined) return {year:+full[3], month:GED_MONTHS[full[2].toUpperCase()], day:+full[1], hasDay:true, hasMonth:true, display:str};
  const monYear = str.match(/([A-Za-z]{3})\s+(\d{4})/);
  if(monYear && GED_MONTHS[monYear[1].toUpperCase()]!==undefined) return {year:+monYear[2], month:GED_MONTHS[monYear[1].toUpperCase()], day:1, hasDay:false, hasMonth:true, display:str};
  const yearOnly = str.match(/(\d{4})/);
  if(yearOnly) return {year:+yearOnly[1], month:0, day:1, hasDay:false, hasMonth:false, display:str};
  return null;
}
function dateSortKey(d){
  const p = parseGedDate(d);
  return p ? (p.year*372 + p.month*31 + p.day) : null;
}
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function listen(){
  onSnapshot(query(collection(db, COL), where("type","==","persona")), snap => {
    const p = {};
    snap.forEach(d => p[d.id] = {...d.data(), id: d.id});
    personas = p;
    maybeSeed();
    render();
  });
  onSnapshot(query(collection(db, COL), where("type","==","pendiente")), snap => {
    pendientes = [];
    snap.forEach(d => pendientes.push({...d.data(), id:d.id}));
    render();
  });
  onSnapshot(query(collection(db, COL), where("type","==","historial")), snap => {
    historial = [];
    snap.forEach(d => historial.push({...d.data(), id:d.id}));
    historial.sort((a,b)=> (b.resolvedAt||"").localeCompare(a.resolvedAt||""));
    render();
  });
  onSnapshot(doc(db, COL, "config"), d => {
    if(d.exists()) config = d.data();
    ready = true;
    render();
  });
}

let seedAttempted = false;
async function maybeSeed(){
  if(seedAttempted) return;
  if(Object.keys(personas).length > 0) return; // already has data
  seedAttempted = true;
  const batchSize = 400;
  for(let i=0;i<SEED.length;i+=batchSize){
    const batch = writeBatch(db);
    SEED.slice(i,i+batchSize).forEach(p=>{
      batch.set(doc(db, COL, p.id), {...p, type:"persona"});
    });
    await batch.commit();
  }
  await setDoc(doc(db, COL, "config"), {type:"config", adminPasswordHash: null, seeded:true}, {merge:true});
}

// ---------- Relation helpers ----------
function getParents(id){
  const p = personas[id];
  if(!p) return [];
  return (p.parentIds||[]).filter(x=>personas[x]);
}
function getChildren(id){
  return Object.values(personas).filter(p => (p.parentIds||[]).includes(id)).map(p=>p.id);
}
function getUnions(id){
  const p = personas[id];
  if(!p) return [];
  return (p.unions||[]).filter(u=>personas[u.spouseId] || u.spouseName);
}
function getSpouseIds(id){ return getUnions(id).map(u=>u.spouseId).filter(Boolean); }
function getSiblings(id){
  const parents = getParents(id);
  if(parents.length===0) return [];
  const sibs = new Set();
  parents.forEach(pid => getChildren(pid).forEach(c => { if(c!==id) sibs.add(c); }));
  return Array.from(sibs);
}
function ancestorsWithDistance(id){
  const map = {}; let frontier = [id]; let dist = 0;
  const visited = new Set([id]);
  while(frontier.length){
    const next = [];
    frontier.forEach(pid=>{
      getParents(pid).forEach(par=>{
        if(!visited.has(par)){ visited.add(par); map[par]=dist+1; next.push(par); }
      });
    });
    frontier = next; dist++;
    if(dist>15) break;
  }
  return map;
}
function personName(id){
  const p = personas[id];
  return p ? p.name : "Desconocido";
}
const ORDINALS = ["","segundo","tercero","cuarto","quinto","sexto","séptimo","octavo","noveno","décimo"];
const DIRECT_UP = ["","padre/madre","abuelo/a","bisabuelo/a","tatarabuelo/a"];
const DIRECT_DOWN = ["","hijo/a","nieto/a","bisnieto/a","tataranieto/a"];
function ordinalUp(n){ return n<DIRECT_UP.length ? DIRECT_UP[n] : `ascendiente de ${n}ª generación`; }
function ordinalDown(n){ return n<DIRECT_DOWN.length ? DIRECT_DOWN[n] : `descendiente de ${n}ª generación`; }

function bloodKinship(aId,bId){
  if(aId===bId) return "la misma persona";
  const aAnc = ancestorsWithDistance(aId); aAnc[aId]=0;
  const bAnc = ancestorsWithDistance(bId); bAnc[bId]=0;
  if(bAnc[aId]!==undefined && bAnc[aId]>0) return ordinalDown(bAnc[aId]) + " (línea directa)";
  if(aAnc[bId]!==undefined && aAnc[bId]>0) return ordinalUp(aAnc[bId]) + " (línea directa)";
  let best=null;
  Object.keys(aAnc).forEach(anc=>{
    if(bAnc[anc]!==undefined){
      const dA=aAnc[anc], dB=bAnc[anc];
      if(dA===0||dB===0) return;
      if(!best || (dA+dB) < (best.dA+best.dB)) best={anc,dA,dB};
    }
  });
  if(!best) return null;
  const {dA,dB} = best;
  const m = Math.min(dA,dB), diff = Math.abs(dA-dB);
  if(m===1 && diff===0) return "hermano/a";
  if(m===1 && diff>=1){
    const greats = diff-1;
    const prefix = greats===0?"":( "de ".repeat(0) );
    const tio = greats===0?"tío/tía":("tío/tía "+ (greats===1?"abuelo/a":Array(greats).fill("bisabuelo/a")[0]) );
    // build avuncular chain
    const upWord = dA<dB ? buildAvuncular(diff,false) : buildAvuncular(diff,true);
    return upWord;
  }
  const degree = m-1;
  const cousinLabel = degree===1 ? "primo/a hermano/a (primer grado)" : `primo/a ${ORDINALS[degree]||degree+"º"}`;
  if(diff===0) return cousinLabel;
  const vez = diff===1 ? "vez" : "veces";
  return `${cousinLabel}, ${diff}ª ${vez} removido/a`;
}
function buildAvuncular(diff, aIsOlderLine){
  // diff=1 => tio/sobrino ; diff=2 => tio abuelo/sobrino nieto ; diff=3 => tio bisabuelo/sobrino bisnieto
  const uncleWords = ["tío/tía","tío/tía abuelo/a","tío/tía bisabuelo/a","tío/tía tatarabuelo/a"];
  const nieceWords = ["sobrino/a","sobrino/a nieto/a","sobrino/a bisnieto/a","sobrino/a tataranieto/a"];
  const idx = Math.min(diff-1, uncleWords.length-1);
  return aIsOlderLine ? uncleWords[idx] : nieceWords[idx];
}
function kinshipLabel(aId,bId){
  if(aId===bId) return "la misma persona";
  // direct spouse
  if(getSpouseIds(aId).includes(bId)) return "pareja / cónyuge";
  const blood = bloodKinship(aId,bId);
  if(blood) return blood;
  // in-laws: check spouse of A related to B, or spouse of B related to A
  for(const sId of getSpouseIds(aId)){
    const rel = bloodKinship(sId,bId);
    if(rel){
      if(rel==="hermano/a") return "cuñado/a";
      if(rel.includes("(línea directa)") && rel.startsWith("padre")) return "suegro/a";
      if(rel.includes("(línea directa)") && rel.startsWith("hijo")) return "hijastro/a";
      return "pariente político/a (" + rel + " de tu pareja)";
    }
  }
  for(const sId of getSpouseIds(bId)){
    const rel = bloodKinship(aId,sId);
    if(rel){
      if(rel==="hermano/a") return "cuñado/a";
      if(rel.includes("(línea directa)") && rel.startsWith("hijo")) return "yerno/nuera";
      if(rel.includes("(línea directa)") && rel.startsWith("padre")) return "padrastro/madrastra";
      return "pariente político/a (cónyuge de tu " + rel + ")";
    }
  }
  return null;
}

// ---------- Pending overlay ----------
function pendingEditsFor(personId){
  return pendientes.filter(c => c.kind==="editPerson" && c.targetId===personId);
}
function pendingNotesFor(personId){
  return pendientes.filter(c => c.kind==="note" && c.targetId===personId);
}
function pendingNewPeople(){
  return pendientes.filter(c => c.kind==="newPerson");
}
function pendingUnions(){
  return pendientes.filter(c => c.kind==="newUnion");
}
function mergedPerson(id){
  const base = personas[id];
  if(!base) return null;
  let merged = {...base};
  pendingEditsFor(id).forEach(c=>{
    Object.keys(c.payload||{}).forEach(k=>{
      merged["__pending_"+k] = c.payload[k];
    });
  });
  return merged;
}
function extendedChildren(id){
  const confirmed = getChildren(id);
  const pendingKids = pendingNewPeople().filter(c => (c.payload.parentIds||[]).includes(id)).map(c=>"pend_"+c.id);
  return [...confirmed, ...pendingKids];
}
function extendedSpouseUnions(id){
  const confirmed = getUnions(id).map(u=>({...u, pending:false}));
  const pend = pendingUnions().filter(c=>c.payload.id1===id||c.payload.id2===id).map(c=>{
    const otherId = c.payload.id1===id?c.payload.id2:c.payload.id1;
    return {spouseId:otherId, marrDate:c.payload.marrDate, pending:true, pendingId:c.id};
  });
  const pendNew = pendingNewPeople().filter(c=>c.payload.spouseOf===id).map(c=>({spouseId:"pend_"+c.id, pending:true, pendingId:c.id}));
  return [...confirmed, ...pend, ...pendNew];
}
function resolveDisplayPerson(id){
  if(id.startsWith("pend_")){
    const pid = id.slice(5);
    const c = pendientes.find(x=>x.id===pid);
    if(!c) return null;
    return {id, name:c.payload.name, sex:c.payload.sex, birthDate:c.payload.birthDate, deathDate:null,
      deceased:false, photo:null, isPendingGhost:true, pendingId:pid};
  }
  return mergedPerson(id);
}

// ---------- UI helpers ----------
function initials(name){
  if(!name) return "?";
  const parts = name.trim().split(/\s+/);
  return ((parts[0]?.[0]||"") + (parts[1]?.[0]||"")).toUpperCase();
}
function avatarHtml(p){
  if(p && p.photo) return `<div class="avatar"><img src="${p.photo}" alt=""></div>`;
  return `<div class="avatar">${initials(p ? p.name : "?")}</div>`;
}
function dateShort(d){
  if(!d) return "";
  return d;
}
function lifespan(p){
  const b = p.birthDate ? p.birthDate.match(/\d{4}/) : null;
  const d = p.deathDate ? p.deathDate.match(/\d{4}/) : null;
  const bYear = b ? b[0] : "?";
  if(p.deceased || d) return `${bYear} – ${d ? d[0] : "?"}`;
  return `${bYear}`;
}
function toast(msg){
  const el = document.getElementById("toast-el");
  if(el){ el.remove(); }
  const div = document.createElement("div");
  div.id = "toast-el"; div.className = "toast"; div.textContent = msg;
  document.body.appendChild(div);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>div.remove(), 2600);
}

function personCardHtml(id, opts){
  opts = opts || {};
  const p = resolveDisplayPerson(id);
  if(!p) return "";

  const cls = "person-card" + (opts.center ? " center":"") + (p.isPendingGhost ? " pending":"");
  return `<div class="${cls}" onclick="openPerson('${id}')">

}

function upcomingDates(){
  const today = new Date();
  const items = [];
  Object.values(personas).forEach(p=>{
    if(p.deceased) return;
    const pd = parseGedDate(p.birthDate);
    if(pd && pd.hasMonth){
      let next = new Date(today.getFullYear(), pd.month, pd.hasDay?pd.day:1);
      if(next < today) next = new Date(today.getFullYear()+1, pd.month, pd.hasDay?pd.day:1);
      const diffDays = Math.round((next-today)/86400000);
      if(diffDays<=30) items.push({type:"cumpleaños", name:p.name, date:next, diffDays});
    }
  });
  Object.values(personas).forEach(p=>{
    getUnions(p.id).forEach(u=>{
      if(u.marrDate && personas[u.spouseId] && p.id < u.spouseId){
        const md = parseGedDate(u.marrDate);
        if(!md || !md.hasMonth) return;
        let next = new Date(today.getFullYear(), md.month, md.hasDay?md.day:1);
        if(next < today) next = new Date(today.getFullYear()+1, md.month, md.hasDay?md.day:1);
        const diffDays = Math.round((next-today)/86400000);
        if(diffDays<=30) items.push({type:"aniversario", name:p.name+" y "+personas[u.spouseId].name, date:next, diffDays});
      }
    });
  });
  items.sort((a,b)=>a.diffDays-b.diffDays);
  return items;
}

function renderTree(centerId, full){
  const center = personas[centerId];
  if(!center && !currentUser.isNew){
    return `<main><p class="empty">Persona no encontrada.</p></main>`;
  }
  if(!center){
    return `<main><p class="empty">Todavía no estás vinculado al árbol familiar. Pedile a Hugo que te conecte.</p></main>`;
  }
  const parents = getParents(centerId);
  const grandparents = full ? Array.from(new Set(parents.flatMap(p=>getParents(p)))) : [];
  const greatgrand = full ? Array.from(new Set(grandparents.flatMap(p=>getParents(p)))) : [];
  const siblings = getSiblings(centerId);
  const unions = extendedSpouseUnions(centerId);
  const spouseIds = unions.map(u=>u.spouseId);
  const children = extendedChildren(centerId);
  const grandchildren = full ? Array.from(new Set(children.flatMap(c=> c.startsWith("pend_")?[] : extendedChildren(c)))) : [];
  const aunts = full ? Array.from(new Set(parents.flatMap(p=>getSiblings(p)))) : [];
  const nephews = full ? Array.from(new Set(siblings.flatMap(s=>extendedChildren(s)))) : [];

  let html = `<main>
    <h2>🌳 Mi árbol — centrado en ${center.name}</h2>
    <div class="tree-canvas">`;
  if(full){
    html += renderGenRow("Bisabuelos", greatgrand);
    html += renderGenRow("Abuelos", grandparents);
    html += renderGenRow("Tíos / tías", aunts);
  }
  html += renderGenRow("Padres", parents);
  html += `${connector()}<div class="gen-row"><div class="gen-label">Vos, pareja y hermanos</div><div class="cards-scroll">
    ${siblings.map(id=>personCardHtml(id)).join("")}
    ${personCardHtml(centerId, {center:true})}
    ${spouseIds.map(id=>personCardHtml(id)).join("")}
  </div></div>`;
  html += renderGenRow("Hijos", children);
  if(full){
    html += renderGenRow("Sobrinos", nephews);
    html += renderGenRow("Nietos", grandchildren);
  }
  html += `</div>`;
  if(centerId !== currentUser.id){
    html += `<button class="btn secondary small" onclick="recenter('${currentUser.id}')">Volver a mi centro</button>`;
  }
  html += `</main>`;
  return html;
}

function computeGenerations(){
  const gen = {};
  Object.values(personas).forEach(p=>{ if(getParents(p.id).length===0) gen[p.id]=0; });
  let changed = true, iter = 0;
  while(changed && iter<60){
    changed = false; iter++;
    Object.values(personas).forEach(p=>{
      const parents = getParents(p.id);
      if(parents.length){
        const pg = parents.map(pid=>gen[pid]).filter(g=>g!==undefined);
        if(pg.length){
          const g = Math.max(...pg)+1;
          if(gen[p.id]!==g){ gen[p.id]=g; changed=true; }
        }
      }
    });
    Object.values(personas).forEach(p=>{
      if(gen[p.id]===undefined) return;
      getSpouseIds(p.id).forEach(sid=>{
        if(gen[sid]===undefined){ gen[sid]=gen[p.id]; changed=true; }
      });
    });
  }
  Object.values(personas).forEach(p=>{ if(gen[p.id]===undefined) gen[p.id]=0; });
  return gen;
}

function renderAllTree(){
  const gen = computeGenerations();
  const byGen = {};
  Object.keys(personas).forEach(id=>{
    const g = gen[id];
    (byGen[g] = byGen[g] || []).push(id);
  });
  const gens = Object.keys(byGen).map(Number).sort((a,b)=>a-b);
  let html = `<main>
    <h2>🗺️ Árbol completo — ${Object.keys(personas).length} personas</h2>
    <p class="empty">Organizado por generación, de más antigua a más nueva. Tocá cualquier persona para ver su ficha.</p>
    <div class="tree-canvas">`;
  gens.forEach((g,i)=>{
    const ids = byGen[g].sort((a,b)=> (personas[a].name||"").localeCompare(personas[b].name||""));
    if(i>0) html += connector();
    html += `<div class="gen-row"><div class="gen-label">Generación ${g+1} (${ids.length})</div><div class="cards-scroll">${ids.map(id=>personCardHtml(id)).join("")}</div></div>`;
  });
  html += `</div></main>`;
  return html;
}

    ${allNotes.length ? allNotes.map(n=>`<div class="note-item ${n.pending?'pending':''}">${n.text} ${n.pending?'<span class="badge">Pendiente</span>':""}</div>`).join("") : '<p class="empty">Sin notas todavía.</p>'}
    <div class="row" style="margin-top:1rem;">
      <button class="btn small" onclick="openForm('uploadPhoto','${id}')">＋ Foto</button>
      <button class="btn small" onclick="openForm('addNote','${id}')">＋ Info adicional</button>
      <button class="btn small" onclick="openForm('editDeath','${id}')">＋ Fallecimiento</button>
      <button class="btn small" onclick="openForm('addSpouse','${id}')">＋ Pareja</button>
      <button class="btn small" onclick="openForm('addChild','${id}')">＋ Hijo/a</button>
      <button class="btn small" onclick="openForm('addResidence','${id}')">＋ Residencia</button>
    </div>
    <div class="row" style="margin-top:.6rem;">
      <button class="btn secondary small" onclick="centerOnPerson('${id}')">Ver como centro del árbol</button>
    </div>
  </div></div>`;
}

// ---------- Forms (add data) ----------
window.openForm = function(type, targetId){
  route.formType = type;
  route.formTarget = targetId;
  render();
};
function renderForm(){
  const type = route.formType, targetId = route.formTarget;
  const p = personas[targetId];
  const titleMap = {addNote:"Agregar información", editDeath:"Registrar fallecimiento", addSpouse:"Agregar pareja", addChild:"Agregar hijo/a", addResidence:"Agregar residencia", uploadPhoto:"Subir foto"};
  let body = "";
  if(type==="addNote"){
    body = `<label>Texto</label><textarea id="f-note" rows="3" placeholder="Contá algo sobre ${p?p.name:''}..."></textarea>`;
  } else if(type==="editDeath"){
    body = `<label>Fecha de fallecimiento</label><input type="text" id="f-deathdate" placeholder="ej: 15 MAR 2020">
            <label>Lugar</label><input type="text" id="f-deathplace" placeholder="ej: Buenos Aires, Argentina">`;
  } else if(type==="addResidence"){
    body = `<label>Lugar (país / ciudad)</label><input type="text" id="f-residence-place" placeholder="ej: Buenos Aires, Argentina">
            <label>Desde cuándo (opcional)</label><input type="text" id="f-residence-since" placeholder="ej: 2015 o MAR 2015">`;
  } else if(type==="uploadPhoto"){
    body = storage ? `<label>Elegí una foto</label><input type="file" id="f-photo-file" accept="image/*">`
                   : `<p class="empty">La subida de fotos todavía no está activada — hace falta habilitar Firebase Storage en la consola.</p>`;
  } else if(type==="addSpouse"){
    body = `<label>Nombre de la pareja</label>
      <div class="autocomplete-wrap">
        <input type="text" id="f-spouse-name" placeholder="Buscar o escribir nombre nuevo" autocomplete="off">
        <div id="f-spouse-suggestions"></div>
      </div>
      <input type="hidden" id="f-spouse-id" value="">
      <label>Fecha de casamiento (opcional)</label><input type="text" id="f-marrdate" placeholder="ej: 20 NOV 2010">`;
  } else if(type==="addChild"){
    body = `<label>Nombre del hijo/a</label><input type="text" id="f-child-name" placeholder="Nombre completo">
      <label>Sexo</label><select id="f-child-sex"><option value="M">Masculino</option><option value="F">Femenino</option></select>
      <label>Fecha de nacimiento (opcional)</label><input type="text" id="f-child-birth" placeholder="ej: 3 MAY 2015">
      <label>Otro progenitor (opcional)</label>
      <div class="autocomplete-wrap">
        <input type="text" id="f-otherparent-name" placeholder="Buscar pareja existente" autocomplete="off">
        <div id="f-otherparent-suggestions"></div>
      </div>
      <input type="hidden" id="f-otherparent-id" value="">`;
  }
  setTimeout(()=>attachFormAutocomplete(type), 0);
  const willBePending = !currentUser.isAdmin;
  const disableSubmit = type==="uploadPhoto" && !storage;
  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>${titleMap[type]}</h2>
    ${body}
    ${!disableSubmit ? (willBePending ? '<p class="empty" style="margin-top:.6rem;">Este cambio quedará pendiente de aprobación por Hugo.</p>' : '<p class="empty" style="margin-top:.6rem;">Como administrador, este cambio se aplica directamente.</p>') : ""}
    <div class="row" style="margin-top:1rem;">
      <button class="btn" onclick="submitForm()" ${disableSubmit?"disabled":""}>Guardar</button>
      <button class="btn secondary" onclick="closeModal()">Cancelar</button>
    </div>
  </div></div>`;
}
function attachFormAutocomplete(type){
  if(type==="addSpouse"){
    const input = document.getElementById("f-spouse-name");
    const sug = document.getElementById("f-spouse-suggestions");
    if(!input) return;
    input.addEventListener("input", ()=>{
      const n = normalize(input.value);
      document.getElementById("f-spouse-id").value = "";
      if(n.length<1){ sug.innerHTML=""; return; }
      const matches = Object.values(personas).filter(p=>normalize(p.name).includes(n)).slice(0,6);
      sug.className="suggestions";
      sug.innerHTML = matches.map(p=>`<div onclick="pickSpouse('${p.id}','${p.name.replace(/'/g,"\\'")}')">${p.name}</div>`).join("");
    });
  }
  if(type==="addChild"){
    const input = document.getElementById("f-otherparent-name");
    const sug = document.getElementById("f-otherparent-suggestions");
    if(!input) return;
    input.addEventListener("input", ()=>{
      const n = normalize(input.value);
      document.getElementById("f-otherparent-id").value = "";
      if(n.length<1){ sug.innerHTML=""; return; }
      const matches = Object.values(personas).filter(p=>normalize(p.name).includes(n)).slice(0,6);
      sug.className="suggestions";
      sug.innerHTML = matches.map(p=>`<div onclick="pickOtherParent('${p.id}','${p.name.replace(/'/g,"\\'")}')">${p.name}</div>`).join("");
    });
  }
}
window.pickSpouse = function(id,name){
  document.getElementById("f-spouse-id").value = id;
  document.getElementById("f-spouse-name").value = name;
  document.getElementById("f-spouse-suggestions").innerHTML="";
};
window.pickOtherParent = function(id,name){
  document.getElementById("f-otherparent-id").value = id;
  document.getElementById("f-otherparent-name").value = name;
  document.getElementById("f-otherparent-suggestions").innerHTML="";
};

async function logHistory(entry){
  const id = uid();
  await setDoc(doc(db, COL, id), {...entry, type:"historial", id});
}
async function addPending(kind, targetId, payload){
  const id = uid();
  await setDoc(doc(db, COL, id), {
    type:"pendiente", id, kind, targetId: targetId||null, payload,
    submittedBy: currentUser.name, submittedAt: new Date().toISOString(), status:"pending"
  });
}

window.submitForm = async function(){
  const type = route.formType, targetId = route.formTarget;
  const isAdmin = currentUser.isAdmin;
  try{
    if(type==="addNote"){
      const text = document.getElementById("f-note").value.trim();
      if(!text) return;
      if(isAdmin){
        await updateDoc(doc(db, COL, targetId), {notes: arrayUnion({text, by:currentUser.name, at:new Date().toISOString()})});
        await logHistory({kind:"note", targetId, payload:{text}, submittedBy:currentUser.name, submittedAt:new Date().toISOString(), resolvedBy:currentUser.name, resolvedAt:new Date().toISOString(), status:"approved"});
      } else {
        await addPending("note", targetId, {text});
      }
      toast(isAdmin ? "Nota agregada." : "Nota enviada para aprobación.");
    } else if(type==="editDeath"){
      const deathDate = document.getElementById("f-deathdate").value.trim();
      const deathPlace = document.getElementById("f-deathplace").value.trim();
      const payload = {deathDate: deathDate||null, deathPlace: deathPlace||null, deceased:true};
      if(isAdmin){
        await updateDoc(doc(db, COL, targetId), payload);
        await logHistory({kind:"editPerson", targetId, payload, submittedBy:currentUser.name, submittedAt:new Date().toISOString(), resolvedBy:currentUser.name, resolvedAt:new Date().toISOString(), status:"approved"});
      } else {
        await addPending("editPerson", targetId, payload);
      }
      toast(isAdmin ? "Dato actualizado." : "Cambio enviado para aprobación.");
    } else if(type==="addResidence"){
      const place = document.getElementById("f-residence-place").value.trim();
      const since = document.getElementById("f-residence-since").value.trim() || null;
      if(!place) return;
      const payload = {place, since};
      if(isAdmin){
        await updateDoc(doc(db, COL, targetId), {residences: arrayUnion(payload)});
        await logHistory({kind:"addResidence", targetId, payload, submittedBy:currentUser.name, submittedAt:new Date().toISOString(), resolvedBy:currentUser.name, resolvedAt:new Date().toISOString(), status:"approved"});
      } else {
        await addPending("addResidence", targetId, payload);
      }
      toast(isAdmin ? "Residencia agregada." : "Cambio enviado para aprobación.");
    } else if(type==="uploadPhoto"){
      const fileInput = document.getElementById("f-photo-file");
      const file = fileInput && fileInput.files[0];
      if(!file || !storage) return;
      toast("Subiendo foto...");
      const path = "fotos/" + targetId + "/" + Date.now() + "_" + file.name;
      const sref = ref(storage, path);
      await uploadBytes(sref, file);
      const url = await getDownloadURL(sref);
      const payload = {photo:url};
      if(isAdmin){
        await updateDoc(doc(db, COL, targetId), payload);
        await logHistory({kind:"editPerson", targetId, payload:{photo:"(nueva foto)"}, submittedBy:currentUser.name, submittedAt:new Date().toISOString(), resolvedBy:currentUser.name, resolvedAt:new Date().toISOString(), status:"approved"});
      } else {
        await addPending("editPerson", targetId, payload);
      }
      toast(isAdmin ? "Foto actualizada." : "Foto enviada para aprobación.");
    } else if(type==="addSpouse"){
      const name = document.getElementById("f-spouse-name").value.trim();
      const existingId = document.getElementById("f-spouse-id").value;
      const marrDate = document.getElementById("f-marrdate").value.trim() || null;
      if(!name) return;
      if(existingId){
        const payload = {id1: targetId, id2: existingId, marrDate};
        if(isAdmin){
          await updateDoc(doc(db, COL, targetId), {unions: arrayUnion({spouseId:existingId, marrDate})});
          await updateDoc(doc(db, COL, existingId), {unions: arrayUnion({spouseId:targetId, marrDate})});
          await logHistory({kind:"newUnion", payload, submittedBy:currentUser.name, submittedAt:new Date().toISOString(), resolvedBy:currentUser.name, resolvedAt:new Date().toISOString(), status:"approved"});
        } else {
          await addPending("newUnion", null, payload);
        }
      } else {
        const payload = {name, spouseOf: targetId, marrDate};
        if(isAdmin){
          const newId = uid();
          await setDoc(doc(db, COL, newId), {type:"persona", id:newId, name, sex:null, parentIds:[], unions:[{spouseId:targetId, marrDate}], notes:[], status:"confirmed"});
          await updateDoc(doc(db, COL, targetId), {unions: arrayUnion({spouseId:newId, marrDate})});
          await logHistory({kind:"newPerson", payload, submittedBy:currentUser.name, submittedAt:new Date().toISOString(), resolvedBy:currentUser.name, resolvedAt:new Date().toISOString(), status:"approved"});
        } else {
          await addPending("newPerson", null, payload);
        }
      }
      toast(isAdmin ? "Pareja agregada." : "Cambio enviado para aprobación.");
    } else if(type==="addChild"){
      const name = document.getElementById("f-child-name").value.trim();
      const sex = document.getElementById("f-child-sex").value;
      const birthDate = document.getElementById("f-child-birth").value.trim() || null;
      const otherParentId = document.getElementById("f-otherparent-id").value || null;
      if(!name) return;
      const parentIds = [targetId, otherParentId].filter(Boolean);
      const payload = {name, sex, birthDate, parentIds};
      if(isAdmin){
        const newId = uid();
        await setDoc(doc(db, COL, newId), {type:"persona", id:newId, name, sex, birthDate, parentIds, unions:[], notes:[], status:"confirmed"});
        await logHistory({kind:"newPerson", payload, submittedBy:currentUser.name, submittedAt:new Date().toISOString(), resolvedBy:currentUser.name, resolvedAt:new Date().toISOString(), status:"approved"});
      } else {
        await addPending("newPerson", null, payload);
      }
      toast(isAdmin ? "Hijo/a agregado/a." : "Cambio enviado para aprobación.");
    }
  }catch(e){
    console.error(e);
    toast("Ocurrió un error al guardar. Probá de nuevo.");
    return;
  }
  route.formType=null; route.formTarget=null; route.modalPersonId=null;
  render();
};

// ---------- Kinship screen ----------
function renderKinship(){
  return `<main>
    <h2>🔗 Grado de parentesco</h2>
    <div class="card">
      <label>Vos</label>
      <input type="text" value="${currentUser.name}" disabled>
      <label>¿Con quién querés saber tu parentesco?</label>
      <div class="autocomplete-wrap">
        <input type="text" id="kin-input" placeholder="Escribí un nombre..." autocomplete="off">
        <div id="kin-suggestions"></div>
      </div>
      <div id="kin-result" style="margin-top:1rem;"></div>
    </div>
  </main>`;
}
window.__attachKinship = function(){
  const input = document.getElementById("kin-input");
  if(!input) return;
  input.addEventListener("input", ()=>{
    const n = normalize(input.value);
    const sug = document.getElementById("kin-suggestions");
    if(n.length<1){ sug.innerHTML=""; return; }
    const matches = Object.values(personas).filter(p=>normalize(p.name).includes(n) && p.id!==currentUser.id).slice(0,8);
    sug.className="suggestions";
    sug.innerHTML = matches.map(p=>`<div onclick="computeKinship('${p.id}','${p.name.replace(/'/g,"\\'")}')">${p.name}</div>`).join("");
  });
};
window.computeKinship = function(id,name){
  document.getElementById("kin-suggestions").innerHTML="";
  document.getElementById("kin-input").value = name;
  const label = kinshipLabel(currentUser.id, id);
  const resultEl = document.getElementById("kin-result");
  if(currentUser.isNew || !personas[currentUser.id]){
    resultEl.innerHTML = `<p class="empty">Todavía no estás vinculado al árbol, así que no puedo calcular tu parentesco.</p>`;
  } else if(label){
    resultEl.innerHTML = `<p style="font-size:1.05rem;"><strong>${name}</strong> es tu <strong>${label}</strong>.</p>`;
  } else {
    resultEl.innerHTML = `<p class="empty">No encontré un parentesco directo entre ambos en el árbol.</p>`;
  }
};

// ---------- Timeline ----------
function renderTimeline(){
  const events = [];
  Object.values(personas).forEach(p=>{
    const bd = parseGedDate(p.birthDate);
    if(bd) events.push({sortKey:dateSortKey(p.birthDate), display:bd.display, type:"Nacimiento", text:`Nace ${p.name}`});
    const dd = parseGedDate(p.deathDate);
    if(dd) events.push({sortKey:dateSortKey(p.deathDate), display:dd.display, type:"Fallecimiento", text:`Fallece ${p.name}`});
    getUnions(p.id).forEach(u=>{
      if(u.marrDate && personas[u.spouseId] && p.id < u.spouseId){
        const md = parseGedDate(u.marrDate);
        if(md) events.push({sortKey:dateSortKey(u.marrDate), display:md.display, type:"Casamiento", text:`${p.name} se casa con ${personas[u.spouseId].name}`});
      }
    });
  });
  events.sort((a,b)=>a.sortKey-b.sortKey);
  return `<main>
    <h2>📜 Línea de tiempo familiar</h2>
    <details class="timeline card" open>
      <summary>${events.length} eventos registrados</summary>
      ${events.map(e=>`<div class="tl-item"><div class="tl-year">${e.display}</div><div>${e.text} <span style="color:var(--ink-soft); font-size:.78rem;">· ${e.type}</span></div></div>`).join("")}
    </details>
  </main>`;
}

// ---------- Search ----------
function renderSearch(){
  return `<main>
    <h2>🔍 Buscar persona</h2>
    <div class="card">
      <input type="text" id="search-input" placeholder="Escribí un nombre..." autocomplete="off">
      <div class="search-results" id="search-results"></div>
    </div>
  </main>`;
}
window.__attachSearch = function(){
  const input = document.getElementById("search-input");
  if(!input) return;
  input.addEventListener("input", ()=>{
    const n = normalize(input.value);
    const box = document.getElementById("search-results");
    if(n.length<1){ box.innerHTML=""; return; }
    const matches = Object.values(personas).filter(p=>normalize(p.name).includes(n)).slice(0,20);
    box.innerHTML = matches.map(p=>`<div class="search-result-item" onclick="openPerson('${p.id}')">
      <div class="mini-avatar">${p.photo?`<img src="${p.photo}">`:initials(p.name)}</div>
      <div><div style="font-weight:600;">${p.name}</div><div style="font-size:.75rem; color:var(--ink-soft);">${lifespan(p)}</div></div>
    </div>`).join("") || '<p class="empty">Sin resultados.</p>';
  });
};

// ---------- Places ----------
function renderPlaces(){
  const groups = {};
  Object.values(personas).forEach(p=>{
    const residences = (p.residences && p.residences.length) ? p.residences.map(r=>r.place) : (p.residence ? [p.residence] : []);
    const places = residences.length ? residences : (p.birthPlace ? [p.birthPlace] : []);
    places.forEach(place=>{
      if(!place) return;
      if(!groups[place]) groups[place] = [];
      groups[place].push(p.name);
    });
  });
  const keys = Object.keys(groups).sort();
  return `<main>
    <h2>📍 Lugares</h2>
    <p class="empty">Vista simple por lugar (residencias, o lugar de nacimiento si no hay residencia cargada) — un mapa geográfico interactivo puede sumarse más adelante.</p>
    ${keys.map(k=>`<div class="place-group card" style="margin-bottom:.8rem;"><h3>${k}</h3>${groups[k].join(", ")}</div>`).join("") || '<p class="empty">Todavía no hay lugares cargados.</p>'}
  </main>`;
}

// ---------- Admin ----------
function renderAdmin(){
  return `<main>
    <h2>🛡️ Administración</h2>
    <div class="tabs">
      <button class="tab-btn ${route.adminTab!=='history'?'active':''}" onclick="setAdminTab('pending')">Pendientes (${pendientes.length})</button>
      <button class="tab-btn ${route.adminTab==='history'?'active':''}" onclick="setAdminTab('history')">Historial</button>
    </div>
    ${route.adminTab==='history' ? renderHistoryTab() : renderPendingTab()}
  </main>`;
}
window.setAdminTab = function(t){ route.adminTab=t; render(); };
function describePending(c){
  if(c.kind==="editPerson"){
    if(c.payload.photo) return `Nueva foto para <strong>${personName(c.targetId)}</strong>`;
    return `Editar a <strong>${personName(c.targetId)}</strong>: ${Object.entries(c.payload).map(([k,v])=>`${k}=${v}`).join(", ")}`;
  }
  if(c.kind==="addResidence") return `Nueva residencia para <strong>${personName(c.targetId)}</strong>: ${c.payload.place}${c.payload.since?` (desde ${c.payload.since})`:""}`;
  if(c.kind==="note") return `Nueva nota para <strong>${personName(c.targetId)}</strong>: "${c.payload.text}"`;
  if(c.kind==="newUnion") return `Nueva pareja entre <strong>${personName(c.payload.id1)}</strong> y <strong>${personName(c.payload.id2)}</strong>`;
  if(c.kind==="newPerson" && c.payload.spouseOf) return `Nueva pareja "${c.payload.name}" para <strong>${personName(c.payload.spouseOf)}</strong>`;
  if(c.kind==="newPerson") return `Nueva persona "${c.payload.name}" (hijo/a de ${(c.payload.parentIds||[]).map(personName).join(" y ")})`;
  return c.kind;
}
function renderPendingTab(){
  if(!pendientes.length) return '<p class="empty">No hay cambios pendientes.</p>';
  return pendientes.map(c=>`<div class="pending-list-item">
    <div>${describePending(c)}</div>
    <div style="font-size:.75rem; color:var(--ink-soft); margin:.3rem 0;">Enviado por ${c.submittedBy} · ${new Date(c.submittedAt).toLocaleString()}</div>
    <div class="row">
      <button class="btn small" onclick="approvePending('${c.id}')">✓ Aprobar</button>
      <button class="btn secondary small" onclick="rejectPending('${c.id}')">✕ Rechazar</button>
    </div>
  </div>`).join("");
}
function renderHistoryTab(){
  if(!historial.length) return '<p class="empty">Sin historial todavía.</p>';
  return historial.map(h=>`<div class="hist-item">
    <strong>${h.status==='approved'?'✓ Aprobado':'✕ Rechazado'}</strong> — ${describePending(h)}<br>
    <span style="color:var(--ink-soft);">Enviado por ${h.submittedBy} el ${new Date(h.submittedAt).toLocaleDateString()}, resuelto por ${h.resolvedBy}</span>
  </div>`).join("");
}
window.approvePending = async function(id){
  const c = pendientes.find(x=>x.id===id);
  if(!c) return;
  try{
    if(c.kind==="editPerson"){
      await updateDoc(doc(db, COL, c.targetId), c.payload);
    } else if(c.kind==="addResidence"){
      await updateDoc(doc(db, COL, c.targetId), {residences: arrayUnion({place:c.payload.place, since:c.payload.since})});
    } else if(c.kind==="note"){
      await updateDoc(doc(db, COL, c.targetId), {notes: arrayUnion({text:c.payload.text, by:c.submittedBy, at:c.submittedAt})});
    } else if(c.kind==="newUnion"){
      await updateDoc(doc(db, COL, c.payload.id1), {unions: arrayUnion({spouseId:c.payload.id2, marrDate:c.payload.marrDate})});
      await updateDoc(doc(db, COL, c.payload.id2), {unions: arrayUnion({spouseId:c.payload.id1, marrDate:c.payload.marrDate})});
    } else if(c.kind==="newPerson"){
      const newId = uid();
      if(c.payload.spouseOf){
        await setDoc(doc(db, COL, newId), {type:"persona", id:newId, name:c.payload.name, sex:null, parentIds:[], unions:[{spouseId:c.payload.spouseOf, marrDate:c.payload.marrDate}], notes:[], status:"confirmed"});
        await updateDoc(doc(db, COL, c.payload.spouseOf), {unions: arrayUnion({spouseId:newId, marrDate:c.payload.marrDate})});
      } else {
        await setDoc(doc(db, COL, newId), {type:"persona", id:newId, name:c.payload.name, sex:c.payload.sex, birthDate:c.payload.birthDate, parentIds:c.payload.parentIds||[], unions:[], notes:[], status:"confirmed"});
      }
    }
    await logHistory({kind:c.kind, targetId:c.targetId, payload:c.payload, submittedBy:c.submittedBy, submittedAt:c.submittedAt, resolvedBy:currentUser.name, resolvedAt:new Date().toISOString(), status:"approved"});
    await deleteDoc(doc(db, COL, id));
    toast("Cambio aprobado.");
  }catch(e){ console.error(e); toast("Error al aprobar."); }
};
window.rejectPending = async function(id){
  const c = pendientes.find(x=>x.id===id);
  if(!c) return;
  await logHistory({kind:c.kind, targetId:c.targetId, payload:c.payload, submittedBy:c.submittedBy, submittedAt:c.submittedAt, resolvedBy:currentUser.name, resolvedAt:new Date().toISOString(), status:"rejected"});
  await deleteDoc(doc(db, COL, id));
  toast("Cambio rechazado.");
};

// re-attach dynamic listeners after each render for screens with search inputs
const origRender = render;
window.__renderTick = 0;
function renderAndAttach(){
  origRender();
  if(route.screen==="kinship") window.__attachKinship();
  if(route.screen==="search") window.__attachSearch();
}
// override global render usage
render = renderAndAttach;

listen();
</script>
